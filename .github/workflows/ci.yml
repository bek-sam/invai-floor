name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invai-floor
    steps:
      - uses: actions/checkout@v4
        with:
          path: invai-floor
      # Private sibling repo linked via link:../invai-contracts. Needs secret CONTRACTS_DEPLOY_KEY
      # (private half of a read-only deploy key on bek-sam/invai-contracts).
      # Same branch name as this PR/push when invai-contracts has it (cross-repo changes land together), else main.
      - uses: actions/checkout@v4
        id: contracts_branch
        continue-on-error: true
        with:
          repository: bek-sam/invai-contracts
          path: invai-contracts
          ref: ${{ github.head_ref || github.ref_name }}
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        if: steps.contracts_branch.outcome == 'failure'
        with:
          repository: bek-sam/invai-contracts
          path: invai-contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
      # Private sibling repo linked via link:../invai-ui. Needs secret UI_DEPLOY_KEY
      # (private half of a read-only deploy key on bek-sam/invai-ui).
      # Same branch name as this PR/push when invai-ui has it (cross-repo changes land together), else main.
      - uses: actions/checkout@v4
        id: ui_branch
        continue-on-error: true
        with:
          repository: bek-sam/invai-ui
          path: invai-ui
          ref: ${{ github.head_ref || github.ref_name }}
          ssh-key: ${{ secrets.UI_DEPLOY_KEY }}
      - uses: actions/checkout@v4
        if: steps.ui_branch.outcome == 'failure'
        with:
          repository: bek-sam/invai-ui
          path: invai-ui
          ssh-key: ${{ secrets.UI_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: invai-floor/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: invai-floor/.nvmrc
          cache: pnpm
          cache-dependency-path: invai-floor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: invai-contracts
      - run: pnpm install --frozen-lockfile
        working-directory: invai-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm run --if-present test
      - run: pnpm build
