name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invai-floor
    env:
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: invai-floor
          persist-credentials: false
      # invai-contracts and invai-ui are private sibling repos (linked via link:../invai-contracts
      # and link:../invai-ui), read with the existing read-only deploy keys. All work happens on
      # main (CLAUDE.md: no feature branches, no PRs), so there is only ever one ref to check out.
      - name: Check out invai-contracts (sibling, main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-contracts
          ref: main
          path: invai-contracts
          ssh-key: ${{ secrets.CONTRACTS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Check out invai-ui (sibling, main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: bek-sam/invai-ui
          ref: main
          path: invai-ui
          ssh-key: ${{ secrets.UI_DEPLOY_KEY }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: invai-floor/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: invai-floor/.nvmrc
          cache: pnpm
          cache-dependency-path: invai-floor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: invai-contracts
      - run: pnpm install --frozen-lockfile
        working-directory: invai-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm run --if-present test
      - run: pnpm build
